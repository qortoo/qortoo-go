name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

env:
  # The qortoo-rs commit that provides the qortoo-ffi native SDK this package is built
  # and tested against. Pinned deliberately so a routine PR here never breaks because of
  # an unrelated change on qortoo-rs/main — see canary.yml for that signal instead.
  # Canary opens a dedicated PR to update this after the exact commit passes on every
  # supported OS and remains ABI-compatible (see version.go's expectedABIMajor).
  QORTOO_RS_REF: 2f71dd4f2ac7dbb600ab20aece9bad241cd85fe9

jobs:
  quality:
    name: quality (ubuntu-latest, go stable)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - name: Checkout qortoo-go
        uses: actions/checkout@v4
        with:
          path: qortoo-go

      - name: Checkout qortoo-rs (pinned)
        uses: actions/checkout@v4
        with:
          repository: qortoo/qortoo-rs
          ref: ${{ env.QORTOO_RS_REF }}
          path: qortoo-rs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: qortoo-go/go.sum

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            qortoo-rs/target
          key: ${{ runner.os }}-cargo-ffi-${{ env.QORTOO_RS_REF }}-${{ hashFiles('qortoo-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ffi-${{ env.QORTOO_RS_REF }}-

      - name: Stage native SDK
        run: |
          make -C qortoo-rs native-sdk-stage
          echo "CGO_CFLAGS=-I${{ github.workspace }}/qortoo-rs/target/native-sdk/debug/include" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L${{ github.workspace }}/qortoo-rs/target/native-sdk/debug/lib" >> "$GITHUB_ENV"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
          working-directory: qortoo-go

      - name: Go coverage
        run: make -C qortoo-go coverage GO_COVERAGE_MIN=90

      - name: Record Go coverage
        if: ${{ always() }}
        run: |
          if [ -f qortoo-go/coverage.out ]; then
            total=$(go tool cover -func=qortoo-go/coverage.out | awk '/^total:/ { print $3 }')
            {
              echo "### Go binding coverage"
              echo "Root package statement coverage: **$total** (required: **90%**)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Go coverage artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: |
            qortoo-go/coverage.out
            qortoo-go/coverage.html
          if-no-files-found: error

      - name: Upload Go coverage to Codecov
        if: ${{ success() && env.HAS_CODECOV_TOKEN == 'true' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: qortoo-go/coverage.out
          flags: go
          fail_ci_if_error: false

  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # "1.25" is the minimum supported version (the `go` directive in go.mod);
        # "stable" is the latest supported version.
        go-version: ["1.25", "stable"]
    steps:
      - name: Checkout qortoo-go
        uses: actions/checkout@v4
        with:
          path: qortoo-go

      - name: Checkout qortoo-rs (pinned)
        uses: actions/checkout@v4
        with:
          repository: qortoo/qortoo-rs
          ref: ${{ env.QORTOO_RS_REF }}
          path: qortoo-rs

      # Kept in sync with qortoo-rs's own CI pin (.github/workflows/build-test-coverage.yml)
      # since we build the qortoo-ffi crate checked out from that repository.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: qortoo-go/go.sum

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            qortoo-rs/target
          key: ${{ runner.os }}-cargo-ffi-${{ env.QORTOO_RS_REF }}-${{ hashFiles('qortoo-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ffi-${{ env.QORTOO_RS_REF }}-

      - name: gofmt check
        working-directory: qortoo-go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "error: the following files are not gofmt-formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Verify benchmark contract
        run: |
          qortoo-go/scripts/check-benchmark-contract.sh \
            --qortoo-go "${{ github.workspace }}/qortoo-go" \
            --qortoo-rs "${{ github.workspace }}/qortoo-rs"

      - name: Stage native SDK
        run: |
          make -C qortoo-rs native-sdk-stage
          echo "CGO_CFLAGS=-I${{ github.workspace }}/qortoo-rs/target/native-sdk/debug/include" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L${{ github.workspace }}/qortoo-rs/target/native-sdk/debug/lib" >> "$GITHUB_ENV"

      # Cross-checks the staged manifest against the ABI major this package is built
      # against (version.go), so a mismatch fails clearly here instead of only at
      # runtime via that file's init() panic.
      - name: Verify Go/FFI ABI compatibility
        run: |
          manifest=qortoo-rs/target/native-sdk/debug/manifest.json
          staged_major=$(grep -o '"abi_version_major": *[0-9]*' "$manifest" | grep -o '[0-9]*$')
          expected_major=$(grep -o 'expectedABIMajor = [0-9]*' qortoo-go/version.go | grep -o '[0-9]*$')
          echo "staged qortoo-ffi ABI major: $staged_major, qortoo-go expects: $expected_major"
          if [ "$staged_major" != "$expected_major" ]; then
            echo "error: ABI major mismatch — update expectedABIMajor in qortoo-go/version.go or QORTOO_RS_REF in ci.yml" >&2
            exit 1
          fi

      - name: Record native SDK artifact checksums
        run: |
          {
            echo "### Native SDK checksums ($QORTOO_RS_REF)"
            echo '```'
            shasum -a 256 \
              qortoo-rs/target/native-sdk/debug/lib/libqortoo_ffi.a \
              qortoo-rs/target/native-sdk/debug/include/qortoo.h
            cat qortoo-rs/target/native-sdk/debug/manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: go vet
        working-directory: qortoo-go
        run: go vet ./...

      - name: go test -race
        working-directory: qortoo-go
        run: go test -race ./...

      # Installing a global tracing subscriber/metrics recorder is only safe once per
      # process, so these tests are re-run shuffled and repeated to catch ordering and
      # cross-test global-state leaks that a single fixed-order pass would hide.
      - name: go test -race (observability, shuffled/repeated)
        working-directory: qortoo-go
        run: |
          go test -race -shuffle=on -count=2 \
            -run '^(TestTraceContext|TestContextAwareOperationsWithoutObservability|TestInitObservability|TestObservability|TestShutdownObservability|TestShutdownTimeout)' \
            ./...

      - name: Compile examples
        working-directory: qortoo-go
        run: go build ./examples/...
